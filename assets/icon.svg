<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="streamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0061FF"/>
    </linearGradient>

    <linearGradient id="streamRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#E100FF"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>

    <linearGradient id="streamOverlap" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#6FB1FC"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0052D4" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7F00FF" flood-opacity="0.25"/>
    </filter>

    <filter id="innerDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Glow & Shadow Layer -->
  <g filter="url(#softGlow)">
    <!-- Left Wing (Cyan to Azure Stream) -->
    <path d="M 120,100 C 120,80 145,68 162,80 L 256,150 L 256,360 L 160,260 C 130,230 120,190 120,100 Z" 
          fill="url(#streamLeft)" opacity="0.95"/>

    <!-- Right Wing (Violet to Magenta Stream) -->
    <path d="M 392,100 C 392,80 367,68 350,80 L 256,150 L 256,360 L 352,260 C 382,230 392,190 392,100 Z" 
          fill="url(#streamRight)" opacity="0.95"/>

    <!-- Converging Center V Apex -->
    <path d="M 130,110 C 145,95 180,110 256,230 C 332,110 367,95 382,110 C 400,130 380,200 286,390 C 272,418 240,418 226,390 C 132,200 112,130 130,110 Z" 
          fill="url(#streamOverlap)" filter="url(#innerDepth)"/>
  </g>

  <!-- Specular Top Highlights -->
  <path d="M 140,115 C 160,105 200,140 256,230 C 312,140 352,105 372,115 C 360,110 330,125 256,215 C 182,125 152,110 140,115 Z" 
        fill="#FFFFFF" opacity="0.55"/>

  <!-- Core Velocity Particle -->
  <circle cx="256" cy="245" r="12" fill="#FFFFFF" opacity="0.9"/>
</svg>
