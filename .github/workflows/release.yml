name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: windows
            ext: .exe
            icon: vidownloader/icons/icon.ico
            separator: ";"
          - os: ubuntu-latest
            arch: x64
            platform: linux
            ext: ""
            icon: vidownloader/icons/icon.png
            separator: ":"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libxcb-xinerama0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed \
            --name="ViDownloader" \
            --icon=${{ matrix.icon }} \
            --add-data="vidownloader/fonts${{ matrix.separator }}fonts" \
            --add-data="vidownloader/icons${{ matrix.separator }}icons" \
            --distpath=dist vidownloader/main.py
        shell: bash

      - name: Rename executable
        run: |
          TAG=${{ github.ref_name }}
          ASSET="ViDownloader_${TAG}_${{ matrix.platform }}_${{ matrix.arch }}${{ matrix.ext }}"
          echo "ASSET_NAME=${ASSET}" >> $GITHUB_ENV
          if [ -f "dist/ViDownloader.exe" ]; then
            mv "dist/ViDownloader.exe" "dist/${ASSET}"
          else
            mv "dist/ViDownloader" "dist/${ASSET}"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ env.ASSET_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec mv {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
