name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyqt5-tools

      - name: Compile Qt resources
        run: pyrcc5 vidownloader/resources.qrc -o vidownloader/ui/resources_rc.py

      - name: Build with PyInstaller
        run: |
          $tag = "${{ github.ref_name }}"
          pyinstaller `
            --onefile `
            --windowed `
            --name="ViDownloader-$tag-Windows-x64" `
            --icon=vidownloader/icons/icon.ico `
            --distpath=dist `
            vidownloader/main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViDownloader-Windows
          path: dist/ViDownloader-*-Windows-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get install -y libxcb-xinerama0 libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyqt5-tools

      - name: Compile Qt resources
        run: pyrcc5 vidownloader/resources.qrc -o vidownloader/ui/resources_rc.py

      - name: Build with PyInstaller
        run: |
          TAG="${{ github.ref_name }}"
          ARCH=$(uname -m)
          case $ARCH in
            x86_64)   ARCH="x64" ;;
            aarch64)  ARCH="arm64" ;;
            *)        ARCH="$ARCH" ;;
          esac
          pyinstaller \
            --onefile \
            --windowed \
            --name="ViDownloader-${TAG}-Linux-${ARCH}" \
            --icon=vidownloader/icons/icon.png \
            --distpath=dist \
            vidownloader/main.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViDownloader-Linux
          path: dist/ViDownloader-*-Linux-*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ViDownloader-Windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ViDownloader-Linux
          path: artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/ViDownloader-*-Windows-x64.exe
            artifacts/linux/ViDownloader-*-Linux-*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
