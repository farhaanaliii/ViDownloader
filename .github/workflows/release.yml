name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            asset_name: ViDownloader.exe
            icon: vidownloader/icons/icon.ico
          - os: windows-latest
            arch: arm64
            asset_name: ViDownloader_arm64.exe
            icon: vidownloader/icons/icon.ico
          - os: ubuntu-latest
            arch: x64
            asset_name: ViDownloader_linux
            icon: vidownloader/icons/icon.png
          - os: ubuntu-24.04-arm
            arch: arm64
            asset_name: ViDownloader_linux_aarch64
            icon: vidownloader/icons/icon.png
          - os: macos-13
            arch: x64
            asset_name: ViDownloader_macos
            icon: vidownloader/icons/icon.png
          - os: macos-latest
            arch: arm64
            asset_name: ViDownloader_macos_arm64
            icon: vidownloader/icons/icon.png

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: ${{ matrix.arch }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libxcb-xinerama0 libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyqt5-tools

      - name: Compile resources
        run: pyrcc5 vidownloader/resources.qrc -o vidownloader/ui/resources_rc.py

      - name: Build executable
        run: pyinstaller --onefile --windowed --name="ViDownloader" --icon=${{ matrix.icon }} --distpath=dist vidownloader/main.py
        shell: bash

      - name: Rename executable
        run: |
          if [ -f "dist/ViDownloader.exe" ]; then
            mv "dist/ViDownloader.exe" "dist/${{ matrix.asset_name }}"
          else
            mv "dist/ViDownloader" "dist/${{ matrix.asset_name }}"
          fi
        shell: bash



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec mv {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
