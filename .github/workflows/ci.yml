name: CI

on:
  push:
    branches: [main]
    paths:
      - "vidownloader/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vidownloader/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libgl1 libegl1 xvfb

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linters
        run: |
          flake8 .
          black --check .
          isort --check-only .

      - name: Run tests (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pytest --cov=vidownloader --cov-report=term-missing

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: pytest --cov=vidownloader --cov-report=term-missing
